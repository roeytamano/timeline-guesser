version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: timeline-guesser-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-timeline_guesser}
      POSTGRES_USER: ${POSTGRES_USER:-timeline_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timeline_secret}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
